# Managed by codeality-py. Rules are listed explicitly: ALL expands silently on
# every ruff upgrade, turning a dependency bump into a lint failure.
line-length = 100
target-version = "py312"

[lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # import sorting
  "N",    # pep8-naming
  "UP",   # pyupgrade
  "B",    # bugbear
  "A",    # builtin shadowing
  "C4",   # comprehensions
  "DTZ",  # naive datetimes
  "T20",  # print in library code
  "SIM",  # simplifiable code
  "RET",  # return control flow
  "ARG",  # unused arguments
  "PTH",  # pathlib over os.path
  "ERA",  # commented-out code
  "PL",   # pylint: complexity, branches, statements
  "RUF",  # ruff-specific
  "D",    # docstrings; replaces interrogate
  # Strict additions beyond the codeality baseline: this is a small,
  # dependency-free tool, so every family below costs nothing to keep green.
  "ANN",  # annotations
  "BLE",  # blind except
  "C90",  # mccabe complexity
  "EM",   # exception messages
  "FBT",  # boolean traps
  "FIX",  # FIXME/TODO markers in code
  "FLY",  # static joins
  "FURB", # refurb
  "G",    # logging format
  "ICN",  # import conventions
  "INP",  # implicit namespace packages
  "ISC",  # implicit string concatenation
  "LOG",  # logging
  "PERF", # performance
  "PGH",  # pygrep hooks
  "PIE",  # misc lints
  "PT",   # pytest style
  "PYI",  # stub style
  "Q",    # quotes
  "RSE",  # raise
  "SLF",  # private member access
  "SLOT", # __slots__
  "TC",   # type-checking imports
  "TD",   # TODO comment format
  "TID",  # tidy imports
  "TRY",  # exception handling
  "S",    # bandit, full set; tests relax only S101
]
ignore = [
  # Conflicts with the formatter; keeping these on fights ruff format forever.
  "E501", "W191", "E111", "E114", "E117", "D206", "D300", "COM812", "ISC001",
  "D203",  # incompatible with D211
  "D107",  # an __init__ that stores its arguments has nothing to add to the class docstring
  "D213",  # incompatible with D212
]

[lint.per-file-ignores]
# **/ so the pattern also reaches nested test roots such as host/tests.
"**/tests/**" = ["D", "S101", "INP001", "PLR2004"]
# The commands report to the terminal; print is their output channel.
"tadu/run_doctor.py" = ["T201"]
"tadu/run_sync.py" = ["T201"]
"tadu/read_sync_source.py" = ["T201"]
"tadu/run_init.py" = ["T201"]
"tadu/create_missing_file.py" = ["T201"]
"tadu/run_close.py" = ["T201"]
"tadu/select_item.py" = ["T201"]
"tadu/write_closed_backlog.py" = ["T201"]
"tadu/close_command.py" = ["T201"]
"tadu/print_diff.py" = ["T201"]
"tadu/read_backlog.py" = ["T201"]
"tadu/prepare_close.py" = ["T201"]
"tadu/plan_close.py" = ["T201"]
"tadu/backlog_unchanged.py" = ["T201"]
"tadu/hook_command.py" = ["T201"]
"**/conftest.py" = ["D"]

[lint.mccabe]
max-complexity = 8

[lint.pylint]
max-args = 4
max-branches = 8
max-returns = 4
max-statements = 30

[lint.flake8-tidy-imports]
ban-relative-imports = "all"

[lint.pydocstyle]
convention = "google"

[format]
docstring-code-format = true
