; Managed by codeality-py, tightened past its baseline.
[mypy]
strict = True
warn_unreachable = True
show_error_codes = True
pretty = True
exclude = (?x)(^build/|^dist/|/migrations/)
disallow_any_explicit = True
disallow_any_unimported = True
disallow_any_decorated = True
local_partial_types = True
strict_bytes = True
enable_error_code = ignore-without-code, redundant-expr, redundant-self, truthy-bool, truthy-iterable, possibly-undefined, unused-awaitable, unused-ignore, deprecated, explicit-override, mutable-override, exhaustive-match
