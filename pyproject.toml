[project]
name = "tadu"
version = "0.2.0"
description = "A repository backlog agents keep: TODO.md, TODO_LOG.md and a history index, with a checker and a rule updater"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "filelock>=3.16",
  "platformdirs>=4.3",
]

[project.optional-dependencies]
# Only `tadu board --auth github` needs these.
github = [
  "cryptography>=44",
  "limits>=4",
  "oauthlib>=3.2",
  "requests>=2.32",
  "requests-oauthlib>=2",
  "werkzeug>=3.1",
]

[project.urls]
Homepage = "https://github.com/syntopica/tadu"
Issues = "https://github.com/syntopica/tadu/issues"

[project.scripts]
tadu = "tadu.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tadu*"]

[tool.setuptools.package-data]
tadu = ["rule_block_v5.md", "rule_block_v5_tasks.md", "board/*.html", "board/*.js", "board/*.css"]

[tool.pytest.ini_options]
# -n auto: the tests run in parallel on every core (pytest-xdist); -n 0 runs them in one process.
addopts = "-ra --strict-markers --strict-config -n auto -m 'not crash and not node and not live'"
xfail_strict = true
filterwarnings = ["error"]
testpaths = ["tests"]
# `-m "not browser"`, `-m node` and `-m crash` select the slow groups.
markers = [
  "browser: drives the board in a real Chromium through Playwright",
  "node: audits the board page with Node.js tools (jsdom, axe-core, Chromium); slow, so run apart: pytest -m node",
  "live: asks the real GitHub API with the token in TADU_LIVE_GITHUB_TOKEN (read only); run with `pytest -m live`",
  "crash: stops each writing command at each filesystem change; slow, run with `pytest -m crash`",
]

[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 100
exclude_also = ['if __name__ == "__main__":']

[tool.deptry.per_rule_ignores]
DEP004 = ["pytest"]

[dependency-groups]
quality = [
  # the tests cover the GitHub sign-in too
  "tadu[github]",
  "syntopica-codeality-py>=0.2.5,<1",
  "deptry>=0.25.1,<1",
  "mypy>=2.4,<3",
  "pip-audit>=2.10.1,<3",
  "pytest>=9.1.1,<10",
  "pytest-cov>=7.1,<8",
  "pytest-xdist>=3.8,<4",
  "ruff>=0.17,<1",
  "hypothesis>=6.100",
  "jsonschema>=4.23",
  "mcp>=1.20",
  "playwright>=1.45",
  "types-jsonschema",
  "types-requests",
  "types-requests-oauthlib",
  "types-oauthlib",
]

[tool.uv]
default-groups = ["quality"]

[tool.deptry]
# bench/ holds study scripts (REPORT.md), not part of the tadu package.
extend_exclude = ["bench"]
