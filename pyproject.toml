[project]
name = "tadu"
version = "0.1.0"
description = "A repository backlog agents keep: TODO.md, TODO_LOG.md and a history index, with a checker and a rule updater"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
tadu = "tadu.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tadu*"]

[tool.setuptools.package-data]
tadu = ["rule_block_v1.md"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
xfail_strict = true
filterwarnings = ["error"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 100
exclude_also = ['if __name__ == "__main__":']

[tool.deptry.per_rule_ignores]
DEP004 = ["pytest"]

[dependency-groups]
quality = [
  "syntopica-codeality-py>=0.2.5,<1",
  "deptry>=0.25.1,<1",
  "mypy>=2.4,<3",
  "pip-audit>=2.10.1,<3",
  "pytest>=9.1.1,<10",
  "pytest-cov>=7.1,<8",
  "ruff>=0.17,<1",
]

[tool.uv]
default-groups = ["quality"]
