<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>tadu</title>
<link rel="stylesheet" href="board.css">
<script type="module" src="app.js"></script>
</head>
<body>
<div class="app" id="app">
<aside class="sidebar" id="sidebar" aria-label="Navigation">
<div class="brand">tadu</div>
<nav class="nav" id="nav-views" aria-label="Views"></nav>
<section class="nav-section" id="attention-section" hidden>
<h2 class="nav-heading">Needs a person</h2>
<div class="nav" id="nav-attention"></div>
</section>
<section class="nav-section" id="favourites-section" hidden>
<h2 class="nav-heading">Starred</h2>
<div class="nav" id="nav-favourites"></div>
</section>
<section class="nav-section" id="companies-section" hidden>
<h2 class="nav-heading">Companies</h2>
<div class="nav" id="nav-companies"></div>
</section>
<section class="nav-section" id="recent-section" hidden>
<h2 class="nav-heading">Recent</h2>
<div class="nav" id="nav-recent"></div>
</section>
<section class="nav-section" id="workspace-views-section" hidden>
<h2 class="nav-heading">Workspace views</h2>
<div class="nav" id="nav-workspace-views"></div>
</section>
<section class="nav-section">
<h2 class="nav-heading">Saved views</h2>
<div class="nav" id="nav-saved"></div>
<form class="save-view" id="save-view-form">
<input id="save-view-name" type="text" maxlength="40" placeholder="Name the current view" aria-label="Name for the saved view" autocomplete="off">
<button type="submit" class="icon-button" aria-label="Save the current view" title="Save the current view"><span data-icon="plus"></span></button>
</form>
</section>
<div class="sidebar-foot">
<div class="account" id="account" hidden>
<p class="account-login"><span data-icon="user"></span><span id="account-login"></span></p>
<button type="button" class="nav-item theme-toggle" id="sign-out"><span data-icon="arrowRight"></span>Sign out</button>
</div>
<p class="read-only"><span data-icon="info"></span> <span id="access-label">Read only</span></p>
<button type="button" class="nav-item theme-toggle" id="theme-toggle"><span data-icon="sun"></span><span id="theme-label">Theme: Auto</span></button>
</div>
</aside>

<main class="main" id="main">
<div class="session-warning" id="session-warning" role="alert" hidden>
<p id="session-warning-text"></p>
<button type="button" class="button primary" id="stay-signed-in">Stay signed in</button>
<button type="button" class="button" id="session-sign-out">Sign out</button>
</div>
<div class="phone-top">
<span class="brand">tadu</span>
<span class="pill" id="access-pill">Read only</span>
<button type="button" class="icon-button" id="phone-search" aria-label="Search"><span data-icon="search"></span></button>
</div>

<header class="topbar">
<div class="scope-bar" role="group" aria-label="Scope">
<button type="button" class="scope-trigger" data-picker="scope" aria-haspopup="dialog" aria-expanded="false" aria-controls="picker"><span data-icon="grid"></span><span class="scope-title">Scope:</span><span class="picker-value"></span><span data-icon="chevronDown"></span></button>
<button type="button" class="icon-button" id="favourite" aria-pressed="false" aria-label="Star this scope" title="Star this scope" hidden><span data-icon="star"></span></button>
</div>
<div class="topbar-status">
<button type="button" class="notice-button" id="problems-button" aria-expanded="false" aria-controls="problems-panel" hidden><span data-icon="alert"></span><span id="problems-label"></span></button>
<span class="updated" id="updated" role="status">Loading...</span>
<button type="button" class="icon-button" id="reload" aria-label="Reload from the files" title="Reload from the files"><span data-icon="refresh"></span></button>
</div>
</header>
<div class="notice-panel" id="problems-panel" hidden></div>

<div class="page-head">
<div>
<h1 id="page-title">Board</h1>
<p class="subtitle" id="page-subtitle"></p>
</div>
<div class="head-end">
<button type="button" class="button primary new-item" id="new-item" aria-label="New item" hidden><span data-icon="plus"></span><span class="new-item-label">New item</span></button>
<div class="head-status">
<span class="updated" id="updated-phone"></span>
<button type="button" class="icon-button" id="reload-phone" aria-label="Reload from the files"><span data-icon="refresh"></span></button>
</div>
</div>
</div>

<div class="toolbar" id="toolbar">
<label class="search"><span data-icon="search"></span><input id="search" type="search" placeholder="Search items…" aria-label="Search items by their text, project, repository, people or labels; type assignee:ana or is:overdue to add a filter" autocomplete="off" spellcheck="false"><kbd id="search-key">Ctrl K</kbd></label>
<button type="button" class="tool-button filter-add" id="filter-add" aria-haspopup="dialog" aria-expanded="false" aria-controls="filter-menu" aria-keyshortcuts="F"><span data-icon="plus"></span><span class="tool-label">Filter</span><span class="count" id="filters-count" hidden></span><kbd>F</kbd></button>
<span class="toolbar-gap"></span>
<div class="popover-anchor">
<button type="button" class="tool-button" id="display-button" aria-label="Display options" aria-expanded="false" aria-controls="display-popover"><span data-icon="sliders"></span><span class="tool-label">Display</span><span class="display-summary" id="display-summary"></span><span data-icon="chevronDown"></span></button>
<div class="popover display-popover" id="display-popover" role="dialog" aria-label="Display" hidden>
<div class="display-grid">
<label>Group<select id="group"></select></label>
<label>Sort<select id="sort"></select></label>
<label>Done from the last<select id="done-days"></select></label>
</div>
<div class="popover-checks">
<label><input type="checkbox" id="show-empty"> Show empty columns</label>
<label><input type="checkbox" id="filter-showCancelled"> Show cancelled items</label>
</div>
</div>
</div>
<div class="segmented" role="group" aria-label="Layout">
<button type="button" id="layout-list" aria-pressed="false"><span data-icon="list"></span>List</button>
<button type="button" id="layout-board" aria-pressed="true"><span data-icon="columns"></span>Board</button>
</div>
</div>

<div class="toolbar" id="portfolio-toolbar" hidden>
<label class="search"><span data-icon="search"></span><input id="portfolio-search" type="search" placeholder="Search companies, projects or repositories..." aria-label="Search companies, projects or repositories" autocomplete="off" spellcheck="false"></label>
<label class="tool-button select-tool accent"><span data-icon="layers"></span>Group: <select id="portfolio-group" aria-label="Group by"></select><span data-icon="chevronDown"></span></label>
<label class="tool-button select-tool"><span data-icon="done"></span>State: <select id="portfolio-state" aria-label="State"><option value="">All</option><option value="backlog">Backlog</option><option value="in_progress">In progress</option><option value="blocked">Blocked</option><option value="done">Done</option></select><span data-icon="chevronDown"></span></label>
</div>

<div class="chips" id="active-chips" hidden></div>
<div class="summary" id="summary"></div>
<div class="list-head" id="list-head" hidden></div>
<div class="content" id="content" tabindex="-1"></div>
<p class="visually-hidden" id="drag-hint">Drag it to another column to change its state, or open it for the same changes.</p>
</main>

<aside class="detail" id="detail" aria-label="Item detail" hidden></aside>
<nav class="bottom-nav" id="bottom-nav" aria-label="Quick views"></nav>
<div class="picker" id="picker" role="dialog" aria-label="Choose where to look" hidden>
<label class="picker-search"><span data-icon="search"></span><input id="picker-input" type="search" role="combobox" aria-expanded="true" aria-controls="picker-list" aria-autocomplete="list" aria-label="Search companies, projects and repositories" placeholder="Search companies, projects, repositories…" autocomplete="off" spellcheck="false"></label>
<ul class="picker-list" id="picker-list" role="tree" aria-multiselectable="true" aria-label="Companies, projects and repositories"></ul>
<div class="picker-foot"><span class="picker-summary" id="picker-summary"></span><span class="picker-keys">Enter: only · Shift+Enter: add</span><button type="button" class="link-button" id="picker-clear">Clear</button></div>
</div>
</div>
<div class="menu" id="filter-menu" role="dialog" aria-labelledby="filter-menu-title" hidden>
<div class="menu-head" id="filter-menu-head"></div>
<label class="picker-search"><span data-icon="search"></span><input id="filter-menu-input" type="search" role="combobox" aria-expanded="true" aria-controls="filter-menu-list" aria-autocomplete="list" aria-label="Search" autocomplete="off" spellcheck="false"></label>
<ul class="menu-list" id="filter-menu-list" role="listbox" aria-label="Choices"></ul>
<div class="menu-foot" id="filter-menu-foot"></div>
</div>
<div class="change" id="change" role="dialog" aria-modal="true" aria-labelledby="change-title" hidden></div>
<div class="toast" id="notice" role="status" hidden></div>
</body>
</html>
