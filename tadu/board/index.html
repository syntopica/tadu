<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>tadu</title>
<link rel="stylesheet" href="/board.css">
<script type="module" src="/app.js"></script>
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar" aria-label="Navigation">
<div class="brand">tadu</div>
<nav class="nav" id="nav-views" aria-label="Views"></nav>
<section class="nav-section" id="favourites-section" hidden>
<h2 class="nav-heading">Starred</h2>
<div class="nav" id="nav-favourites"></div>
</section>
<section class="nav-section" id="companies-section" hidden>
<h2 class="nav-heading">Companies</h2>
<div class="nav" id="nav-companies"></div>
</section>
<section class="nav-section" id="recent-section" hidden>
<h2 class="nav-heading">Recent</h2>
<div class="nav" id="nav-recent"></div>
</section>
<section class="nav-section">
<h2 class="nav-heading">Saved views</h2>
<div class="nav" id="nav-saved"></div>
<form class="save-view" id="save-view-form">
<input id="save-view-name" type="text" maxlength="40" placeholder="Name the current view" aria-label="Name for the saved view" autocomplete="off">
<button type="submit" class="icon-button" aria-label="Save the current view" title="Save the current view"><span data-icon="plus"></span></button>
</form>
</section>
<div class="sidebar-foot">
<p class="read-only" title="tadu board never changes a file: edit TODO.md in your editor."><span data-icon="info"></span> Read only</p>
<button type="button" class="nav-item theme-toggle" id="theme-toggle"><span data-icon="sun"></span><span id="theme-label">Theme: Auto</span></button>
</div>
</aside>

<div class="main" id="main">
<header class="phone-top">
<span class="brand">tadu</span>
<span class="pill">Read only</span>
<button type="button" class="icon-button" id="phone-search" aria-label="Search"><span data-icon="search"></span></button>
</header>

<header class="topbar">
<div class="scope-bar" role="group" aria-label="Scope">
<button type="button" class="scope-trigger" data-picker="company" aria-haspopup="dialog" aria-expanded="false" aria-controls="picker"><span data-icon="building"></span><span class="scope-title">Company:</span><span class="picker-value"></span><span data-icon="chevronDown"></span></button>
<button type="button" class="scope-trigger" data-picker="project" aria-haspopup="dialog" aria-expanded="false" aria-controls="picker"><span data-icon="folder"></span><span class="scope-title">Project:</span><span class="picker-value"></span><span data-icon="chevronDown"></span></button>
<button type="button" class="scope-trigger" data-picker="repository" aria-haspopup="dialog" aria-expanded="false" aria-controls="picker"><span data-icon="repo"></span><span class="scope-title">Repository:</span><span class="picker-value"></span><span data-icon="chevronDown"></span></button>
<button type="button" class="icon-button" id="favourite" aria-pressed="false" aria-label="Star this scope" title="Star this scope" hidden><span data-icon="star"></span></button>
</div>
<div class="topbar-status">
<button type="button" class="notice-button" id="problems-button" aria-expanded="false" aria-controls="problems-panel" hidden><span data-icon="alert"></span><span id="problems-label"></span></button>
<span class="updated" id="updated" role="status">Loading...</span>
<button type="button" class="icon-button" id="reload" aria-label="Reload from the files" title="Reload from the files"><span data-icon="refresh"></span></button>
</div>
</header>
<div class="notice-panel" id="problems-panel" hidden></div>

<div class="page-head">
<div>
<h1 id="page-title">Board</h1>
<p class="subtitle" id="page-subtitle"></p>
</div>
<div class="head-status">
<span class="updated" id="updated-phone"></span>
<button type="button" class="icon-button" id="reload-phone" aria-label="Reload from the files"><span data-icon="refresh"></span></button>
</div>
</div>

<div class="toolbar" id="toolbar">
<label class="search"><span data-icon="search"></span><input id="search" type="search" placeholder="Search tasks, projects or repositories..." aria-label="Search tasks, projects or repositories" autocomplete="off" spellcheck="false"><kbd id="search-key">Ctrl K</kbd></label>
<span class="divider"></span>
<div class="popover-anchor">
<button type="button" class="tool-button" id="filters-button" aria-expanded="false" aria-controls="filters-popover"><span data-icon="filter"></span>Filters<span class="count" id="filters-count" hidden></span><span data-icon="chevronDown"></span></button>
<div class="popover" id="filters-popover" role="dialog" aria-labelledby="filters-title" hidden>
<div class="popover-head"><h2 id="filters-title"><span data-icon="filter"></span>Scope &amp; filters</h2><button type="button" class="link-button" id="clear-all">Clear all</button></div>
<div id="popover-scope">
<h3 class="popover-section">Scope <span>(where to look)</span></h3>
<div class="popover-grid scope-grid">
<div class="field"><span class="field-label">Company</span><button type="button" class="scope-trigger field-trigger" data-picker="company" aria-haspopup="dialog" aria-expanded="false" aria-controls="picker"><span data-icon="building"></span><span class="picker-value"></span><span data-icon="chevronDown"></span></button></div>
<div class="field"><span class="field-label">Project</span><button type="button" class="scope-trigger field-trigger" data-picker="project" aria-haspopup="dialog" aria-expanded="false" aria-controls="picker"><span data-icon="folder"></span><span class="picker-value"></span><span data-icon="chevronDown"></span></button></div>
<div class="field"><span class="field-label">Repository</span><button type="button" class="scope-trigger field-trigger" data-picker="repository" aria-haspopup="dialog" aria-expanded="false" aria-controls="picker"><span data-icon="repo"></span><span class="picker-value"></span><span data-icon="chevronDown"></span></button></div>
</div>
</div>
<h3 class="popover-section">Filters <span>(narrow the results)</span></h3>
<div class="popover-grid">
<label>Assignee<input id="filter-assignee" type="search" list="filter-assignee-options" placeholder="Any" autocomplete="off" spellcheck="false"><datalist id="filter-assignee-options"></datalist></label>
<label>Priority<select id="filter-priority"></select></label>
<label>Label<input id="filter-label" type="search" list="filter-label-options" placeholder="Any" autocomplete="off" spellcheck="false"><datalist id="filter-label-options"></datalist></label>
<label>State<select id="filter-column"></select></label>
<label>Due before<input id="filter-dueBefore" type="date"></label>
<label>Role<select id="filter-role"></select></label>
<label>Organization<input id="filter-organization" type="search" list="filter-organization-options" placeholder="Any" autocomplete="off" spellcheck="false"><datalist id="filter-organization-options"></datalist></label>
</div>
<div class="popover-checks">
<label><input type="checkbox" id="filter-unassigned"> Unassigned</label>
<label><input type="checkbox" id="filter-noPriority"> No priority</label>
<label><input type="checkbox" id="filter-waitingOnMe"> Waiting on me</label>
<label><input type="checkbox" id="filter-showCancelled"> Show cancelled</label>
<label><input type="checkbox" id="show-empty"> Show empty columns</label>
</div>
</div>
</div>
<label class="tool-button select-tool" id="group-tool">Group: <select id="group" aria-label="Group by"></select><span data-icon="chevronDown"></span></label>
<label class="tool-button select-tool" id="sort-tool">Sort: <select id="sort" aria-label="Sort by"></select><span data-icon="chevronDown"></span></label>
<span class="divider"></span>
<div class="segmented" role="group" aria-label="Layout">
<button type="button" id="layout-list" aria-pressed="false"><span data-icon="list"></span>List</button>
<button type="button" id="layout-board" aria-pressed="true"><span data-icon="columns"></span>Board</button>
</div>
</div>

<div class="toolbar" id="portfolio-toolbar" hidden>
<label class="search"><span data-icon="search"></span><input id="portfolio-search" type="search" placeholder="Search companies, projects or repositories..." aria-label="Search companies, projects or repositories" autocomplete="off" spellcheck="false"></label>
<label class="tool-button select-tool accent"><span data-icon="layers"></span>Group: <select id="portfolio-group" aria-label="Group by"></select><span data-icon="chevronDown"></span></label>
<label class="tool-button select-tool"><span data-icon="done"></span>State: <select id="portfolio-state" aria-label="State"><option value="">All</option><option value="backlog">Backlog</option><option value="in_progress">In progress</option><option value="blocked">Blocked</option><option value="done">Done</option></select><span data-icon="chevronDown"></span></label>
</div>

<div class="chips" id="active-chips" hidden></div>
<div class="summary" id="summary"></div>
<div class="list-head" id="list-head" hidden></div>
<main class="content" id="content" tabindex="-1"></main>
</div>

<aside class="detail" id="detail" aria-label="Item detail" hidden></aside>
<nav class="bottom-nav" id="bottom-nav" aria-label="Views"></nav>
<div class="picker" id="picker" role="dialog" aria-label="Choose a scope" hidden>
<label class="picker-search"><span data-icon="search"></span><input id="picker-input" type="search" role="combobox" aria-expanded="true" aria-controls="picker-list" aria-autocomplete="list" aria-label="Search" autocomplete="off" spellcheck="false"></label>
<ul class="picker-list" id="picker-list" role="listbox" aria-label="Choices"></ul>
</div>
</div>
</body>
</html>
