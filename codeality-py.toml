# codeality-py configuration - https://github.com/syntopica/codeality
# Tightened past the codeality baseline: full coverage, a short suite budget
# and smaller file caps.
schema-version = 1
source-roots = ["tadu"]
test-roots = ["tests"]
import-package = "tadu"
respect-gitignore = true
coverage-threshold = 100
# The suite runs in well under a second; a slow test is a design smell here.
test-budget-seconds = 10

[limits]
max-file-lines = 80
test-max-file-lines = 200

[roles]
data = [
  "tadu/closed_item_pattern.py",
  "tadu/doctor_checks.py",
  "tadu/element_start_pattern.py",
  "tadu/entry_boundary_pattern.py",
  "tadu/fence_line_pattern.py",
  "tadu/index_required_keys.py",
  "tadu/legacy_rule_heading_pattern.py",
  "tadu/legacy_rule_section_pattern.py",
  "tadu/log_entry_pattern.py",
  "tadu/log_marker_pattern.py",
  "tadu/required_log_labels.py",
  "tadu/review_statuses.py",
  "tadu/rule_block_close_pattern.py",
  "tadu/rule_block_open_pattern.py",
  "tadu/rule_block_version.py",
  "tadu/single_line_start_pattern.py",
  "tadu/state_markers.py",
]
registry = []
entrypoint = ["tadu/cli.py"]
generated = []
namespace-init = ["tadu/__init__.py"]
