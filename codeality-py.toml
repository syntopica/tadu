  "tadu/category_prefix_pattern.py",
  "tadu/category_prefix_words.py",
  "tadu/closed_item_pattern.py",
  "tadu/columns.py",
  "tadu/day_heading_pattern.py",
  "tadu/default_http_port.py",
  "tadu/display_title_limit.py",
  "tadu/doctor_checks.py",
  "tadu/element_start_pattern.py",
  "tadu/entry_boundary_pattern.py",
  "tadu/fence_line_pattern.py",
  "tadu/field_checks.py",
